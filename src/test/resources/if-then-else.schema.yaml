type: object
properties:
  country:
    type: string
  postalCode:
    type: string
if:
  properties:
    country:
      const: "USA"
then:
  properties:
    postalCode:
      type: string
      pattern: "^[0-9]{5}$"
else:
  properties:
    postalCode:
      type: string
      pattern: "^[A-Z][0-9][A-Z] [0-9][A-Z][0-9]$"