type: object
properties:
  billing:
    $ref: '#/$defs/Address'
  shipping:
    $ref: '#/$defs/Address'
  contact:
    $ref: '#/$defs/Person'
$defs:
  Address:
    type: object
    properties:
      street:
        type: string
      city:
        type: string
  Person:
    type: object
    properties:
      name:
        type: string
      phone:
        type: string