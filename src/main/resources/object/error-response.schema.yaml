type: object
required:
  - error
properties:
  error:
    type: object
    required:
      - code
      - message
    properties:
      code:
        type: string
        enum:
          - VALIDATION_ERROR
          - NOT_FOUND
          - UNAUTHORIZED
          - INTERNAL_ERROR
      message:
        type: string
      details:
        type: array
        items:
          type: object
          properties:
            field:
              type: string
            reason:
              type: string
      timestamp:
        type: string
        format: date-time
