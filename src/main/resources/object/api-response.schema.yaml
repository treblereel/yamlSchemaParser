type: object
required:
  - success
  - data
properties:
  success:
    type: boolean
  data:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/Item'
      total:
        type: integer
  meta:
    type: object
    properties:
      page:
        type: integer
      pageSize:
        type: integer
      totalPages:
        type: integer
  errors:
    type: array
    items:
      $ref: '#/$defs/Error'
$defs:
  Item:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
  Error:
    type: object
    properties:
      code:
        type: string
      message:
        type: string
